[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "jevbench"
version = "0.1.0"
description = "A backend-neutral benchmark for Jev-style typed decision models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jevbench contributors" }]
dependencies = []

[project.scripts]
jevbench = "jevbench.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

